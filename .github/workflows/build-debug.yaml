name: Build Debug

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
    
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ~/.dotnet
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          
      - name: Set up variables
        id: vars
        run: |
          # Extract package version from project
          version=$(grep -oP '<Version>\K[^<]+' RepoXR.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          
      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"
          
      - name: Restore NuGet packages
        run: dotnet restore
        
      - name: Build app
        run: dotnet build
        
      # This fork is not packaged as the official DaXcess Thunderstore mod.
      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: RepoXR-FBT-${{ steps.vars.outputs.version }}-dev-${{ steps.vars.outputs.sha_short }}
          path: |
            bin/Debug/netstandard2.1/RepoXR.dll
            bin/Debug/netstandard2.1/RepoXR.Preload.dll
            FBT.md
            LICENSE