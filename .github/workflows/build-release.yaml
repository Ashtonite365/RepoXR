name: Build Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ~/.dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Set up variables
        id: vars
        run: |
          # Extract package version from project
          version=$(grep -oP '<Version>\K[^<]+' RepoXR.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build app
        run: dotnet build -c Release

      # This fork is not published as DaXcess-RepoXR and does not push to nuget.daxcess.io.
      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: RepoXR-FBT-${{ steps.vars.outputs.version }}
          path: |
            bin/Release/netstandard2.1/RepoXR.dll
            bin/Release/netstandard2.1/RepoXR.Preload.dll
            bin/Release/netstandard2.1/RepoXR.pdb
            FBT.md
            LICENSE
            CHANGELOG.md